# Comprueba cada PR y cada push a main: editor, generador y plugin de Maven, con sus tests.
# Los tests e2e (Docker, Testcontainers) quedan fuera, como en local: mvn test -Pe2e.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Editor (tipos, tests y bundle)
        working-directory: editor
        run: |
          npm ci
          npm run copy

      - name: Generador
        run: mvn -B -Dgpg.skip=true -f model-driven-generator/pom.xml install

      - name: Plugin de Maven
        run: mvn -B -Dgpg.skip=true -f plugin/pom.xml verify
