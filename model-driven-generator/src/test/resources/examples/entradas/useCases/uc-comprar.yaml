  type: "Custom"
  intent: "Con el precio vigente que da Catálogo (consultarPrecio): rechaza si las entradas no están entre 1 y 6, si el concierto no está EN_VENTA o si pide más de las disponibles («Solo quedan N entradas»); disponibles = aforo de ConciertoView menos las entradas de las compras de ese concierto que no están RECHAZADA ni CANCELADA. Si no, crea la compra PENDIENTE con importe = precio × entradas y devuelve CompraRealizada."
